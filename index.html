<main><div class="warn"><b>نسخة تجريبية رقم 3 — بيانات وهمية فقط.</b> التبديل بين الشريك والموظف محاكاة، وليس تسجيل دخول حقيقيًا. البيانات تُحفظ في هذا المتصفح فقط، ويمكن لأي شخص لديه وصول لهذا المتصفح رؤيتها. لا تدخل أرقام جوال أو أسماء عملاء أو مستندات حقيقية. إرسال SMS غير مفعل.</div>

<script>
(()=>{'use strict';const KEY='eitimad_v2_demo',seed={employees:[{id:1,name:'أحمد (تجريبي)',phone:'+966500000000',status:'تجريبي'}],cases:[{id:101,title:'قضية تجارية تجريبية',client:'عميل افتراضي',lead:'رائد',staff:1}],memos:[{id:1,caseId:101,author:1,status:'review',notes:'',version:1}]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){db=JSON.parse(JSON.stringify(seed))}db.cases.forEach(c=>{if(c.lead==='الشريك الأول')c.lead='شريفة';if(c.lead==='الشريك الثاني')c.lead='رائد'});let role='partner',tab='home';const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('تعذر حفظ البيانات في المتصفح')}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function employeeName(id){return db.employees.find(x=>x.id==id)?.name||'غير معين'}function caseName(id){return db.cases.find(x=>x.id==id)?.title||'قضية غير معروفة'}function status(s){return {review:'بانتظار مراجعة المحامي الأساسي',approved:'معتمدة — جاهزة للتقديم',changes:'مطلوب تعديل',filed:'تم تسجيل التقديم'}[s]||s}const navs={partner:[['home','الرئيسية'],['employees','الموظفون'],['cases','القضايا'],['memos','الاعتمادات'],['finance','المالية']],employee:[['home','الرئيسية'],['cases','قضاياي'],['memos','مذكراتي'],['fees','أتعابي']]};function row(a,b,c=''){return `<div class="row"><div><b>${esc(a)}</b>${c?`<div class="muted">${esc(c)}</div>`:''}</div><span class="badge">${esc(b)}</span></div>`}function card(title,body){return `<div class="box"><h3>${title}</h3>${body}</div>`}function render(){let links=navs[role];if(!links.some(x=>x[0]===tab))tab='home';$('nav').innerHTML=links.map(([k,n])=>`<button data-tab="${k}" class="${k===tab?'on':''}">${n}</button>`).join('');let h='';if(tab==='home'){h=`<h2>${role==='partner'?'لوحة الشركاء':'لوحة الموظف'}</h2><div class="grid">${card('القضايا',String(role==='partner'?db.cases.length:db.cases.filter(c=>c.staff===1).length))}${card('مذكرات تنتظر المراجعة',String(db.memos.filter(m=>m.status==='review').length))}</div>${card('آخر الإجراءات',row('مذكرة القضية 101',status(db.memos[0]?.status||'review')) )}`}
if(tab==='employees'){h=`<h2>إدارة الموظفين — نموذج</h2>${card('إضافة موظف تجريبي',`<form id="addEmp"><label>اسم افتراضي<input name="name" required maxlength="60" placeholder="مثال: محامٍ تجريبي"></label><label>رقم تجريبي بصيغة دولية<input name="phone" required pattern="\\+[1-9][0-9]{6,14}" placeholder="+966500000000"></label><button class="gold">إضافة إلى التجربة</button></form><p class="muted">لا تُرسل دعوة SMS. هذه قائمة محلية للتجربة فقط.</p>`)}${card('الموظفون',db.employees.map(e=>row(e.name,e.status,e.phone)).join(''))}`}
if(tab==='cases'){h=`<h2>${role==='partner'?'إدارة القضايا':'قضاياي'}</h2>${role==='partner'?card('إضافة قضية تجريبية',`<form id="addCase"><label>عنوان القضية<input name="title" required maxlength="90"></label><label>اسم عميل افتراضي<input name="client" required maxlength="90"></label><label>المحامي الأساسي<select name="lead"><option>رائد</option><option>شريفة</option></select></label><label>الموظف المكلف<select name="staff">${db.employees.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></label><button class="gold">إضافة القضية</button></form>`):''}${card('القضايا المسندة',db.cases.filter(c=>role==='partner'||c.staff===1).map(c=>row(c.title,'المحامي الأساسي: '+c.lead,'العميل: '+c.client+' — الموظف: '+employeeName(c.staff))).join('')||'لا توجد قضايا')}`}
if(tab==='memos'){h=`<h2>${role==='partner'?'اعتماد المذكرات':'مذكراتي'}</h2>${db.memos.filter(m=>role==='partner'||m.author===1).map(m=>{const c=db.cases.find(x=>x.id===m.caseId);return card(esc(caseName(m.caseId)),`<p>الحالة: <b>${status(m.status)}</b></p><p class="muted">المحامي الأساسي: ${esc(c?.lead||'غير محدد')} • أعدها: ${esc(employeeName(m.author))} • الإصدار: ${m.version}</p><p>ملاحظات: ${esc(m.notes||'لا توجد')}</p>${role==='partner'?`<label>ملاحظات المراجعة<textarea id="note${m.id}" maxlength="500"></textarea></label><div class="controls"><button data-act="approve" data-id="${m.id}" ${m.status==='review'?'':'disabled'}>اعتماد</button><button data-act="changes" data-id="${m.id}" ${m.status==='review'?'':'disabled'}>إعادة للتعديل</button></div>`:`<div class="controls"><button data-act="resubmit" data-id="${m.id}" ${m.status==='changes'?'':'disabled'}>إعادة إرسال نسخة معدلة (محاكاة)</button><button data-act="file" data-id="${m.id}" ${m.status==='approved'?'':'disabled'}>تسجيل التقديم (محاكاة)</button></div>`}`)}).join('')||card('المذكرات','لا توجد مذكرات')}`;}
if(tab==='finance')h=`<h2>الإدارة المالية — بيانات افتراضية</h2><div class="grid">${card('إيرادات تجريبية','80,000 ريال')}${card('مصروفات تجريبية','22,000 ريال')}</div><p class="muted">هذا القسم يظهر فقط عند اختيار وضع الشريك في المعاينة. الحماية الفعلية تتطلب خادمًا وتسجيل دخول.</p>`;
if(tab==='fees')h=`<h2>أتعابي — مثال فقط</h2>${card('المستحقات',row('إجمالي أتعاب تجريبية','3,500 ريال')+row('المصروف','2,000 ريال')+row('المتبقي','1,500 ريال'))}`;
$('view').innerHTML=h;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});const emp=$('addEmp');if(emp)emp.onsubmit=e=>{e.preventDefault();const f=new FormData(emp),name=String(f.get('name')).trim(),phone=String(f.get('phone')).trim();if(!name||!/^\+[1-9]\d{6,14}$/.test(phone))return alert('أدخل اسمًا ورقمًا تجريبيًا بصيغة دولية');db.employees.push({id:Date.now(),name,phone,status:'تجريبي — بلا SMS'});save();render()};const cf=$('addCase');if(cf)cf.onsubmit=e=>{e.preventDefault();const f=new FormData(cf);db.cases.push({id:Date.now(),title:String(f.get('title')).trim(),client:String(f.get('client')).trim(),lead:String(f.get('lead')),staff:Number(f.get('staff'))});save();render()};document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const m=db.memos.find(x=>x.id===Number(b.dataset.id));if(!m)return;const a=b.dataset.act;if(a==='approve'&&m.status==='review')m.status='approved';if(a==='changes'&&m.status==='review'){m.status='changes';m.notes=$('note'+m.id)?.value||'يرجى التعديل'}if(a==='resubmit'&&m.status==='changes'){m.status='review';m.version++}if(a==='file'&&m.status==='approved')m.status='filed';save();render()})} $('role').onchange=e=>{role=e.target.value;tab='home';render()};$('reset').onclick=()=>{if(confirm('إعادة جميع بيانات التجربة إلى البداية؟')){db=JSON.parse(JSON.stringify(seed));save();render()}};render()})();
</script></html>
