<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>اعتماد | شركة اعتماد الرائد للمحاماة</title>
<style>
:root{--navy:#14253b;--gold:#b99045;--bg:#f4f6f8;--line:#e1e5ea}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:#203047}button,select,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #b99045}header{background:var(--navy);color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header strong{color:#e4c183;font-size:28px}header small{display:block;color:#ccd4dd;margin-top:4px}.btn{border:1px solid #cbd2da;background:white;color:#203047;border-radius:9px;padding:10px 14px}.primary{background:var(--gold);border-color:var(--gold);color:#fff}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;max-width:1200px;margin:24px auto;padding:0 16px}aside,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:16px}aside button{display:block;width:100%;text-align:start;border:0;border-radius:8px;background:transparent;padding:12px;color:inherit;margin-bottom:3px}aside button.active{background:var(--navy);color:white}h1{font-size:24px;margin:0 0 6px}h2{font-size:18px;margin:0 0 12px}.muted{color:#667589;font-size:13px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.toolbar select{padding:10px;border:1px solid #cbd2da;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.metric{padding:20px;background:white;border:1px solid var(--line);border-radius:12px}.metric b{display:block;font-size:24px;margin-top:10px;color:var(--navy)}.panel{margin-top:14px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.item:last-child{border:0}.badge{background:#edf2f7;border-radius:20px;padding:6px 10px;font-size:12px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.note{background:#fff8e9;border:1px solid #edd7a7;padding:12px;border-radius:9px;margin-top:15px;font-size:13px;line-height:1.8}textarea{width:100%;border:1px solid var(--line);padding:12px;border-radius:9px;min-height:90px}footer{text-align:center;color:#69788a;font-size:12px;padding:24px}.hidden{display:none}@media(max-width:650px){.layout{display:block;margin:14px auto}aside{display:flex;overflow:auto;gap:5px;margin-bottom:15px;padding:8px}aside button{white-space:nowrap;width:auto;flex:none;margin:0}header{padding:16px}header strong{font-size:22px}.metric{padding:14px}.metric b{font-size:20px}}
</style></head><body>
<header><div><strong>⚖ اعتماد</strong><div id="firm">شركة اعتماد الرائد للمحاماة</div><small id="brandSub">نظام إدارة أعمال المحاماة • نسخة تجريبية</small></div><button class="btn" id="lang">English</button></header>
<div class="layout"><aside id="menu" aria-label="القائمة"></aside><main><div class="toolbar"><label id="roleLabel" for="role">تجربة الحساب:</label><select id="role"><option value="partner">الشريك — الإدارة</option><option value="employee">الموظف — أحمد</option></select></div><h1 id="title"></h1><p class="muted" id="subtitle"></p><div id="view"></div><div class="note" id="disclaimer">⚠ هذه نسخة تجريبية ببيانات وهمية. لا توجد قاعدة بيانات أو حسابات حقيقية أو حماية صلاحيات على الخادم. لا تدخل بيانات عملاء فعلية.</div></main></div><footer>© شركة اعتماد الرائد للمحاماة — نموذج للمعاينة فقط</footer>
<script>
(()=>{const S={role:'partner',tab:'home',lang:'ar',memo:'review',comment:''};
const names={home:['لوحة التحكم','Dashboard'],cases:['القضايا','Cases'],clients:['العملاء','Clients'],tasks:['المهام','Tasks'],memos:['اعتماد المذكرات','Memo approvals'],finance:['الإدارة المالية','Finance'],reports:['التقارير','Reports'],documents:['مذكراتي','My memos'],fees:['أتعابي','My fees'],alerts:['الإشعارات','Notifications']};
const partner=['home','cases','clients','tasks','memos','finance','reports'],employee=['home','cases','tasks','documents','fees','alerts'];
const el=id=>document.getElementById(id),t=(a,b)=>S.lang==='ar'?a:b,n=k=>names[k][S.lang==='ar'?0:1];
const row=(a,b,c='')=>`<div class="item"><div><b>${a}</b>${c?`<div class="muted">${c}</div>`:''}</div><span class="badge">${b}</span></div>`;
const panel=(title,body)=>`<section class="panel"><h2>${title}</h2>${body}</section>`;
const metrics=items=>`<div class="grid">${items.map(([a,b])=>`<div class="metric"><span class="muted">${a}</span><b>${b}</b></div>`).join('')}</div>`;
function render(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';el('firm').textContent=t('شركة اعتماد الرائد للمحاماة',"E'timad Al-Raed Law Firm");el('brandSub').textContent=t('نظام إدارة أعمال المحاماة • نسخة تجريبية','Law practice management • Demo');el('lang').textContent=t('English','العربية');el('roleLabel').textContent=t('تجربة الحساب:','Demo account:');el('role').options[0].text=t('الشريك — الإدارة','Partner — management');el('role').options[1].text=t('الموظف — أحمد','Employee — Ahmed');el('disclaimer').textContent=t('⚠ هذه نسخة تجريبية ببيانات وهمية. لا توجد قاعدة بيانات أو حسابات حقيقية أو حماية صلاحيات على الخادم. لا تدخل بيانات عملاء فعلية.','⚠ Demo with fictional data. No real database, authentication or server-side authorization. Do not enter actual client data.');let keys=S.role==='partner'?partner:employee;if(!keys.includes(S.tab))S.tab='home';el('menu').innerHTML=keys.map(k=>`<button data-tab="${k}" class="${S.tab===k?'active':''}">${n(k)}</button>`).join('');el('title').textContent=n(S.tab);el('subtitle').textContent=S.role==='partner'?t('لوحة الشركاء — صلاحيات متساوية','Partners dashboard — equal permissions'):t('لوحة الموظف — معلومات الأعمال المسندة فقط','Employee dashboard — assigned work only');let h='';
switch(S.tab){
case 'home':h=metrics([[t('القضايا النشطة','Active cases'),S.role==='partner'?'12':'3'],[t('المهام المفتوحة','Open tasks'),S.role==='partner'?'8':'2'],[t('المذكرات قيد المراجعة','Memos under review'),'1'],[S.role==='partner'?t('مستحقات العملاء','Receivables'):t('أتعابي المتبقية','My outstanding fees'),S.role==='partner'?'45,000 ر.س':'1,500 ر.س']])+panel(t('آخر الأنشطة','Recent activity'),row(t('مذكرة القضية 101','Case 101 memo'),t('بانتظار مراجعة رائد','Awaiting Raed review'))+row(t('مراجعة مستندات القضية 102','Review case 102 files'),t('قيد العمل','In progress')));break;
case 'cases':h=panel(n('cases'),row(t('القضية التجارية 101','Commercial case 101'),t('نشطة','Active'),t('المحامي الأساسي: رائد','Lead: Raed'))+row(t('القضية العمالية 102','Labor case 102'),t('نشطة','Active'),t('المحامي الأساسي: الشريك الأول','Lead: Partner 1'))+row(t('قضية التنفيذ 103','Enforcement case 103'),t('نشطة','Active'),t('المحامي الأساسي: رائد','Lead: Raed')));break;
case 'clients':h=panel(n('clients'),row(t('شركة المثال التجارية','Example Trading Company'),t('قضيتان','2 cases'),t('ملف العميل وعقوده ومراسلاته','Client file, contracts and correspondence'))+row(t('عميل تجريبي 02','Sample Client 02'),t('قضية واحدة','1 case')));break;
case 'tasks':h=panel(n('tasks'),row(t('إعداد مذكرة دفاع','Prepare defense memo'),t('قيد المراجعة','Under review'),t('القضية 101 — رائد','Case 101 — Raed'))+row(t('مراجعة مستندات','Review documents'),t('قيد العمل','In progress'),t('القضية 102','Case 102')));break;
case 'memos':case 'documents':{const status={review:t('بانتظار المراجعة','Awaiting review'),approved:t('معتمدة','Approved'),changes:t('إعادة للتعديل','Changes requested'),filed:t('تم تسجيل التقديم','Filing recorded')}[S.memo];h=panel(t('مذكرة دفاع — القضية 101','Defense memo — Case 101'),row(t('إعداد: أحمد • اعتماد: رائد','Author: Ahmed • Approver: Raed'),status)+`<p class="muted">${t('هذه محاكاة لدورة الاعتماد. لا يتم رفع ملفات أو إرسال مذكرات فعليًا.','This simulates the approval process; no files are uploaded or submitted.')}</p>`+(S.role==='partner'?`<label>${t('ملاحظات المراجع','Reviewer notes')}<textarea id="comment" placeholder="${t('اكتب ملاحظات المراجعة','Write review notes')}"></textarea></label><div class="buttons"><button class="btn primary" data-action="approve">${t('اعتماد','Approve')}</button><button class="btn" data-action="changes">${t('إعادة للتعديل','Request changes')}</button></div>`:`<p>${t('الملاحظات:','Notes:')} ${S.comment||t('لا توجد ملاحظات','None')}</p><div class="buttons"><button class="btn primary" data-action="file" ${S.memo==='approved'?'':'disabled'}>${t('تسجيل التقديم','Record filing')}</button><button class="btn" data-action="resubmit" ${S.memo==='changes'?'':'disabled'}>${t('إعادة إرسال بعد التعديل','Resubmit after changes')}</button></div>`));break;}
case 'finance':h=metrics([[t('الإيرادات المحصلة','Collected revenue'),'80,000 ر.س'],[t('مستحقات العملاء','Receivables'),'45,000 ر.س'],[t('المصروفات','Expenses'),'22,000 ر.س'],[t('رصيد تشغيلي توضيحي','Illustrative operating balance'),'58,000 ر.س']])+panel(t('أقسام مالية خاصة بالشريكين','Partners-only finance sections'),row(t('الحسابات البنكية','Bank accounts'),t('خاص','Private'))+row(t('الرواتب والأتعاب','Payroll and fees'),t('خاص','Private')));break;
case 'fees':h=metrics([[t('إجمالي أتعابي','Total fees'),'3,500 ر.س'],[t('المصروف','Paid'),'2,000 ر.س'],[t('المتبقي','Outstanding'),'1,500 ر.س']])+panel(n('fees'),row(t('القضية 101','Case 101'),'3,000 ر.س')+row(t('مكافأة مهمة','Task bonus'),'500 ر.س'));break;
case 'reports':h=panel(n('reports'),row(t('تقرير القضايا','Cases report'),t('12 قضية','12 cases'))+row(t('التحصيل','Collections'),'80,000 ر.س')+row(t('المصروفات','Expenses'),'22,000 ر.س'));break;
case 'alerts':h=panel(n('alerts'),row(t('مذكرة القضية 101','Case 101 memo'),t('بانتظار مراجعة رائد','Awaiting Raed review'))+row(t('مهمة جديدة','New task'),t('مراجعة مستندات','Review documents')));break;
}el('view').innerHTML=h;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='approve')S.memo='approved';if(a==='changes'){S.memo='changes';S.comment=el('comment').value.trim()}if(a==='resubmit')S.memo='review';if(a==='file')S.memo='filed';render()})}
el('role').onchange=e=>{S.role=e.target.value;S.tab='home';render()};el('lang').onclick=()=>{S.lang=S.lang==='ar'?'en':'ar';render()};render()})();
</script></body></html>
